version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request per ecosystem beats fifteen individual bumps.
      react:
        patterns: ['react', 'react-dom', 'react-router', '@types/react*']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*']
      tooling:
        patterns:
          ['vite', 'vitest', '@vitejs/*', 'typescript', 'eslint*', 'typescript-eslint', 'prettier*']
    ignore:
      # @cloudflare/vitest-pool-workers (0.23.0) only supports vitest ^4.1, and
      # the API tests run inside it. Drop this once it accepts vitest 5.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
