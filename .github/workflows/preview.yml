name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Cloudflare Pages preview
    # Forks cannot read secrets, so there is nothing to deploy with.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping preview deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npm run build

      - name: Seed the preview database
        if: steps.creds.outputs.ready == 'true'
        run: |
          npx wrangler d1 migrations apply not-cal-hacks --remote --env preview
          npm run db:seed
          npx wrangler d1 execute not-cal-hacks-preview --remote --file=./seed.generated.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview
        if: steps.creds.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(npx wrangler pages deploy --branch "${{ github.head_ref }}" 2>&1 | tee /dev/stderr | grep -o 'https://[a-z0-9.-]*\.pages\.dev' | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment the preview URL
        if: steps.creds.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}'
            if (!url) return
            const body = `Preview deployed: ${url}\n\nSeeded against the preview database, separate from production.`
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body.startsWith('Preview deployed:'))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              })
            }
