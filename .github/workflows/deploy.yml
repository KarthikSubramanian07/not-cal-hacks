name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://not-cal-hacks.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The repository is public and forks cannot read secrets, so this stops
      # the job with a clear message rather than a confusing wrangler error.
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.creds.outputs.ready == 'true'
        run: npm run build

      # Migrations run before the deploy, so the schema is never behind the code
      # that expects it.
      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply not-cal-hacks --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test the deployment
        if: steps.creds.outputs.ready == 'true'
        run: |
          for i in $(seq 1 10); do
            if curl -fsS https://not-cal-hacks.pages.dev/api/health | grep -q '"ok":true'; then
              echo "Health check passed."
              exit 0
            fi
            sleep 6
          done
          echo "::error::Deployment did not become healthy."
          exit 1
