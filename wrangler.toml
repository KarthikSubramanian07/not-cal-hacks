# Cloudflare Pages configuration.
#
# The frontend is a prerendered Vite SPA in `dist/`; the API is a Pages Function
# (`functions/api/[[route]].ts`) that mounts a Hono app. Both ship in a single
# deployment, which is why the public URL has no `/api` split-brain.
name = "not-cal-hacks"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# Top-level bindings are what `wrangler pages dev` reads locally.
#
# The application database is a SQLite-backed Durable Object. Pages cannot host
# the class, so it lives in the companion Worker in `worker/` and is bound here
# by script name.
[[durable_objects.bindings]]
name = "DATABASE"
class_name = "AppDatabase"
script_name = "not-cal-hacks-db"

[vars]
APP_NAME = "not-cal-hacks"

# Production deployments (branch: main).
[env.production]

[[env.production.durable_objects.bindings]]
name = "DATABASE"
class_name = "AppDatabase"
script_name = "not-cal-hacks-db"

[env.production.vars]
APP_NAME = "not-cal-hacks"

# Preview deployments (every other branch, including pull requests). These have
# no database binding at all, so a preview can never touch production rows; the
# API answers 503 there and the pages still render.
[env.preview]

[env.preview.vars]
APP_NAME = "not-cal-hacks (preview)"
