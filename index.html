<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121319" />

    <!--
      Critical inline styles.

      The landing page is prerendered, so real markup exists before the
      stylesheet arrives. Without this the browser paints that markup on white
      for one frame, which on a dark product reads as a broken flash of light
      mode. These three rules are the minimum needed to make the first paint
      correct; everything else can wait for the stylesheet.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        background-color: #121319;
        color: #fafafa;
      }
    </style>

    <title>not-cal-hacks</title>
    <meta
      name="description"
      content="A hackathon application portal for both sides of the table. Applicants apply once and watch their status; organizers review blind, score against a shared rubric, and decide fast."
    />
    <link rel="canonical" href="https://not-cal-hacks.pages.dev/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="not-cal-hacks" />
    <meta property="og:url" content="https://not-cal-hacks.pages.dev/" />
    <meta
      property="og:title"
      content="not-cal-hacks — a hackathon portal that respects both sides of the table"
    />
    <meta
      property="og:description"
      content="Apply in five minutes. Reviewed in thirty seconds. Blind review, a shared rubric, and a queue that spreads coverage evenly."
    />
    <meta property="og:image" content="https://not-cal-hacks.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A hackathon badge hanging from a lanyard against a dark background."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="not-cal-hacks" />
    <meta
      name="twitter:description"
      content="Apply in five minutes. Reviewed in thirty seconds. Legally distinct from any hackathon you may be thinking of."
    />
    <meta name="twitter:image" content="https://not-cal-hacks.pages.dev/og.png" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "not-cal-hacks",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "url": "https://not-cal-hacks.pages.dev/",
        "description": "A hackathon application portal. Applicants apply once and track their status; organizers review applications blind against a shared rubric.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Person", "name": "Karthik Subramanian" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
